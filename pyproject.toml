[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sportsee-rag"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "streamlit==1.44.1", "streamlit-feedback==0.1.4",
    "python-multipart>=0.0.9", "rank-bm25>=0.2.2",
    "langchain==0.3.23", "langchain-core==0.3.86", "langchain-community==0.3.21",
    "langchain-openai==0.3.35", "langsmith==0.3.45",
    "langchain-text-splitters>=0.3.0,<0.4.0",
    "faiss-cpu==1.10.0", "PyPDF2==3.0.1", "python-docx==1.1.2",
    "pymupdf>=1.22.0", "pillow>=9.0.0", "pandas==2.2.3", "openpyxl==3.1.5",
    "numpy>=2.0.0,<2.4.0", "easyocr", "python-dotenv==1.1.0",
    "requests==2.32.3", "tqdm", "tiktoken", "pysbd>=0.3.4", "nest-asyncio",
    "appdirs", "httpx>=0.27.0", "certifi>=2024.0.0", "ragas==0.2.15",
    "datasets>=2.18.0,<2.21.0", "pydantic>=2.0.0", "pydantic-ai", "logfire",
    "orjson==3.10.18", "openai>=1.0.0", "pyarrow>=18.0.0", "google-genai", "google-generativeai>=0.8,<1.0", "langchain-google-genai>=2.0,<3.0"
]

[project.optional-dependencies]
db = ["sqlalchemy", "psycopg2-binary"]
dev = [
    "pytest>=8.0.0", "pytest-cov>=5.0.0", "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0", "ruff>=0.4.0", "black>=24.0.0",
    "mypy>=1.10.0", "ipython>=8.0.0", "watchdog>=4.0.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: tests unitaires rapides, isolés des services externes",
    "integration: tests d'intégration vérifiant plusieurs composants ou le système de fichiers",
]

[tool.ruff]
target-version = "py310"
line-length = 88
